<section class="gerenciador">
  <h2>Gerenciador de tarefas</h2>

  <div class="formulario">
    <input type="text" placeholder="Digite uma tarefa"
           [value]="novaTarefa()"
           (input)="atualizarTexto($event)"
           (keydown.enter)="adicionar()" />
    <button (click)="adicionar()" [disabled]="!novaTarefa().trim()">
      Adicionar
    </button>
  </div>

  <p>Total: {{ tarefas().length }}</p>
  <p>Pendentes: {{ pendentes() }}</p>

  <ul>
    @for (tarefa of tarefas(); track tarefa.id) {
      <li>
        <span [class.concluida]="tarefa.concluida">
          {{ tarefa.titulo }}
        </span>
        <button (click)="alternar(tarefa.id)">
          {{ tarefa.concluida ? 'Reabrir' : 'Concluir' }}
        </button>
        <button (click)="excluir(tarefa.id)">Excluir</button>
      </li>
    } @empty {
      <li>Nenhuma tarefa cadastrada.</li>
    }
  </ul>

  <button (click)="limparConcluidas()">
    Limpar concluídas
  </button>
</section>
